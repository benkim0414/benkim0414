name: Commit scopes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.16.0
      - run: pnpm install --frozen-lockfile
      - name: Validate introduced commit scopes
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const isPr = process.env.GITHUB_EVENT_NAME === 'pull_request';
          const zeroOid = /^(?:0{40}|0{64})$/;
          const resolveOid = (ref, label) => {
            const result = spawnSync(
              'git',
              ['rev-parse', '--verify', `${ref}^{commit}`],
              { encoding: 'utf8' },
            );
            if (result.status !== 0) {
              process.stderr.write(
                `error: Cannot resolve ${label} ${ref}; provide an explicit documented baseline.\n`,
              );
              process.exit(result.status ?? 1);
            }
            return result.stdout.trim();
          };
          let base = isPr ? event.pull_request.base.sha : event.before;
          const head = isPr ? event.pull_request.head.sha : event.after;
          // New-branch pushes set before to the zero OID. Use the default-branch
          // tip as the explicit documented baseline (see docs/agents/commit-scopes.md).
          if (!isPr && zeroOid.test(base)) {
            const defaultBranch = event.repository?.default_branch || 'main';
            base = resolveOid(`origin/${defaultBranch}`, 'default-branch tip');
          }
          const run = (command, args, options = {}) => {
            const result = spawnSync(command, args, { stdio: 'inherit', ...options });
            if (result.status !== 0) process.exitCode = result.status ?? 1;
          };
          const args = ['scripts/check-commit-scopes.mjs'];
          if (isPr) args.push('--pr-title', event.pull_request.title);
          args.push('--base', base, '--head', head);
          const preflight = spawnSync(process.execPath, [...args, '--validate-range'], { stdio: 'inherit' });
          if (preflight.status !== 0) process.exit(preflight.status ?? 1);
          run('pnpm', ['exec', 'commitlint', '--from', base, '--to', head]);
          if (isPr) run('pnpm', ['exec', 'commitlint'], {
            input: `${event.pull_request.title}\n`,
            stdio: ['pipe', 'inherit', 'inherit'],
          });
          run(process.execPath, args);
          NODE
